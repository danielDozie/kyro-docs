worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Ensure JavaScript MIME types are properly recognized
    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
    }
    
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    # Enable Gzip compression for better performance
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # Nixpacks will automatically replace {{PORT}} with the correct internal port
        listen {{PORT}};
        server_name localhost;
        
        root /usr/share/nginx/html;
        index index.html;

        # Force browsers & proxies to always fetch fresh HTML (never serve stale 304s with deleted chunk hashes)
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            if_modified_since off;
            try_files $uri $uri/ $uri.html /index.html;
        }

        # Aggressively cache hashed Vite chunks and static assets
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            default_type application/javascript;
            try_files $uri =404;
        }
    }
}